# Healthcare Analytics Starter Kit
# Grafana PostgreSQL Datasource Configuration

apiVersion: 1

datasources:
  - name: Healthcare Analytics
    type: postgres
    access: proxy
    uid: healthcare-analytics
    url: postgres:5432
    user: hask_user
    database: healthcare_analytics
    isDefault: true
    editable: false
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1400  # PostgreSQL 14
      timescaledb: false
    secureJsonData:
      password: changeme_in_production
